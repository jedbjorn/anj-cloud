# Builds on the VM host (spec #28 Build, Sign, Install): no Gradle daemon outlives a build and the
# JVM stays at 2 GB. GRADLE_USER_HOME/gradle.properties (the Android toolchain's) wins over
# this file and says the same.
org.gradle.daemon=false
org.gradle.jvmargs=-Xmx2g -XX:MaxMetaspaceSize=768m -XX:+HeapDumpOnOutOfMemoryError
kotlin.compiler.execution.strategy=in-process
android.useAndroidX=true
# This newDsl flag was added by the Flutter template
android.newDsl=false
# This builtInKotlin flag was added by the Flutter template
android.builtInKotlin=false
