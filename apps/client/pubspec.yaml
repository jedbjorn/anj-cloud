name: anj_cloud
description: Private Linux cloud client with per-device retention.
publish_to: none
version: 0.1.0+1
environment:
  sdk: '>=3.13.7 <4.0.0'
  flutter: '>=3.47.9'
dependencies:
  flutter:
    sdk: flutter
  camera: 0.12.2
  crypto: 3.0.8
  dbus: 0.7.12
  ffi: 2.2.0
  file_selector: 1.1.0
  flutter_secure_storage: 11.2.0
  image: 4.12.0
  path: 1.9.1
  path_provider: 2.1.6
  pointycastle: 4.0.0
  sqlite3: 3.8.0
  url_launcher: 6.3.3
  xml: 6.6.1
  zxing2: 0.2.4
dev_dependencies:
  flutter_test:
    sdk: flutter
  integration_test:
    sdk: flutter
  flutter_lints: 6.0.0
flutter:
  uses-material-design: true
  assets:
    - assets/branding/harbor/icon-128.png
    - assets/branding/harbor/icon-512.png
    - assets/release/
