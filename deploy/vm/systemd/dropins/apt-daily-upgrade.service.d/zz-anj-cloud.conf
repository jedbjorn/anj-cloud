# Spec #21 VM Operations 4: skip the update run while a backup or restore marker is before its
# deadline or a backup or restore process holds its lock (spec #22 `window --check`: 0 clear,
# 1 busy, 2 error; ExecCondition skips on 1-254, so an error also skips and alerts daily).
[Service]
ExecCondition=/usr/bin/python3 -I @SOURCE@/deploy/backup.py window --check
