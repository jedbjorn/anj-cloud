# Spec #21 VM Operations 4 (decisions #86, #98): the security update run fires after 04:10, when
# spec #22's backup housekeeping has released its lock, with no randomized delay; a missed run is
# not caught up at boot, so updates stay in the nightly window.
[Timer]
OnCalendar=
OnCalendar=*-*-* 04:12:00
RandomizedDelaySec=0
Persistent=false
